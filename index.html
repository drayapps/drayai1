<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAY·AI — עוזר אישי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    <h1>DRAY·<span>AI</span></h1>
  </div>
  <div class="hdr-actions">
    <span id="clock"></span>
    <div class="status" title="לחיצה מציגה סטטוס מלא">SYS <b id="stTxt">ONLINE</b></div>
    <button id="bellBtn" class="hdr-btn" title="התראות">🔔<span id="alertBadge" class="hidden">0</span></button>
    <button id="chatBtn" class="hdr-btn" title="תמלול">💬</button>
    <button id="gearBtn" class="hdr-btn" title="הגדרות">⚙</button>
  </div>
</header>

<main>
  <div class="core-zone">
    <canvas id="core" width="420" height="420" title="לחיצה עוצרת דיבור"></canvas>
    <div class="core-label" id="coreLabel">standby</div>
    <div class="last-answer" id="lastAnswer">שלום יקיר. לחץ על המיקרופון ודבר אליי, או כתוב למטה.</div>
    <div class="chips" id="chips">
      <button class="chip">מה השעה ומה התאריך?</button>
      <button class="chip">מה יש לי היום?</button>
      <button class="chip">תן לי רעיון לארוחת ערב</button>
      <button class="chip">ספר לי משהו מעניין</button>
      <button class="chip">סטטוס מערכת</button>
    </div>
  </div>

  <aside id="aside">
    <div class="head">
      <span>TRANSCRIPT</span>
      <button id="clearBtn">נקה</button>
    </div>
    <div id="log"></div>
  </aside>
</main>

<footer>
  <button id="micBtn" title="דבר אליי">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
    </svg>
  </button>
  <input id="txt" type="text" placeholder="כתוב הודעה… (/עזרה לפקודות)" autocomplete="off">
  <button id="sendBtn">שלח</button>
  <div class="toggles">
    <label class="voice-toggle"><input type="checkbox" id="ttsChk" checked> קול</label>
    <label class="voice-toggle" title="אחרי שאסיים לדבר — אקשיב שוב אוטומטית"><input type="checkbox" id="convChk"> שיחה</label>
  </div>
</footer>

<!-- התראות -->
<div id="alertsPanel">
  <div class="al-head">ALERTS</div>
  <div id="alertsList"></div>
</div>

<!-- הגדרות -->
<div id="settings">
  <div class="set-card">
    <h2>חיבור למוח — Groq API</h2>
    <p>
      DRAY·AI רץ על מודל Llama 3.3 70B דרך Groq — מהיר ובחינם.
      אין לך מפתח? צור אחד ב-<a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>.
      המפתח נשמר <b>רק במכשיר שלך</b> (localStorage) ולא נשלח לשום שרת מלבד Groq.
    </p>
    <label for="keyInput">Groq API Key</label>
    <input id="keyInput" type="password" placeholder="gsk_..." spellcheck="false">
    <div class="set-actions">
      <button id="saveKey">שמור</button>
      <button id="closeSet">סגור</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
